<!DOCTYPE html>
<html>
<head>
    <!--Chart JS-->

        .fa-globe, .fa-facebook, .fa-x-twitter, .fa-instagram, .fa-tiktok, .fa-youtube {
            font-size: 25px;
            color: white;
            margin: 0 10px 0 10px;
        }

        .fa-globe:hover, .fa-facebook:hover, .fa-x-twitter:hover, .fa-instagram:hover, .fa-tiktok:hover, .fa-youtube:hover {
            color: gray;
        }
    </style>

</head>
<body>
    <div class="bg-dark px-5 py-5">
        <h1 class="text-light text-center mb-3">X Trending Topics of <span id="date"></span>
        </h1>
        <p class="text-light text-center mb-3">Trends on X (formerly Twitter)</p>

        <!-- Shows "Last updated", a stale-data notice, or an error message -->
        <div id="status" class="alert alert-secondary text-center" hidden></div>

        <!-- HTML tag used to generate a chart -->
        <canvas id="myChart"></canvas>

    <footer>
