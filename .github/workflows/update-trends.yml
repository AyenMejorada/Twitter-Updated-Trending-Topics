name: Update trends

# Runs twice a day (00:00 and 12:00 UTC) = about 60 runs a month, safely under
# the RapidAPI free limit of 100 requests per month. Also runnable on demand.
on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

# Allow the workflow to push the updated trends.json back to the repo.
permissions:
  contents: write

# Prevent overlapping runs from racing on the commit.
concurrency:
  group: update-trends
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest trends
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: node scripts/update-trends.js

      - name: Commit updated trends.json if it changed
        run: |
          if [ -n "$(git status --porcelain trends.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add trends.json
            git commit -m "chore: update trends.json"
            git push
          else
            echo "No change to trends.json. Nothing to commit."
          fi
